# Custom response headers for AWS Amplify Hosting.
customHeaders:
  - pattern: '**'
    headers:
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: 'camera=(), microphone=(), geolocation=(), interest-cohort=()'
      - key: Strict-Transport-Security
        value: 'max-age=63072000; includeSubDomains'
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

  # Fingerprinted assets never change; HTML must always be revalidated so updates ship.
  - pattern: '/assets/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.html'
    headers:
      - key: Cache-Control
        value: 'no-cache, must-revalidate'
  - pattern: '/sitemap.xml'
    headers:
      - key: Cache-Control
        value: 'public, max-age=3600'
  - pattern: '/robots.txt'
    headers:
      - key: Cache-Control
        value: 'public, max-age=3600'
